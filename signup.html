<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — The Lost Realm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <a href="index.html" class="logo">The Lost Realm</a>
      <div id="session-bar" class="session-bar" hidden>
        <span id="session-label" class="session-label"></span>
        <button id="session-logout-btn" class="btn-ghost session-logout">Log Out</button>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-box">
      <p class="eyebrow">Join the Realm</p>
      <h1>Create Your Account</h1>

      <form id="signup-form">
        <div class="form-row">
          <label for="signup-username">Username</label>
          <input type="text" id="signup-username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" autocomplete="username" />
          <p class="field-hint" id="username-hint">Letters, numbers, and underscores only. Must be unique.</p>
        </div>

        <div class="form-row">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" required autocomplete="email" />
        </div>

        <div class="form-row">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" required minlength="6" autocomplete="new-password" />
          <p class="field-hint">At least 6 characters.</p>
        </div>

        <div class="form-row">
          <label for="signup-password-confirm">Confirm Password</label>
          <input type="password" id="signup-password-confirm" required minlength="6" autocomplete="new-password" />
        </div>

        <button type="submit" class="btn-solid" id="signup-submit-btn">Create Account</button>
        <p id="signup-status" class="form-status" role="status"></p>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <script src="firebase-config.js"></script>
  <script src="session.js"></script>
  <script src="auth.js"></script>
</body>
</html>
