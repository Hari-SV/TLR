<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report a Bug / Feedback — The Lost Realm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <a href="index.html" class="back-link">&larr; Back to Home</a>
      <a href="index.html" class="logo">The Lost Realm</a>
      <div id="session-bar" class="session-bar" hidden>
        <span id="session-label" class="session-label"></span>
      </div>
    </div>
    <button id="session-logout-btn" class="btn-ghost session-logout" hidden>Log Out</button>
  </header>

  <main class="auth-page">
    <div id="report-guest" class="auth-box" hidden>
      <p class="eyebrow">Sign In Required</p>
      <h1>Log In to Report or Give Feedback</h1>
      <p class="field-hint" style="margin-bottom: 24px;">
        This keeps reports tied to an account so we can follow up if needed.
      </p>
      <a href="login.html" class="btn-solid">Log In</a>
      <p class="auth-switch">Need an account? <a href="signup.html">Sign up</a></p>
    </div>

    <div id="report-content" class="auth-box" hidden>
      <p class="eyebrow">We're Listening</p>
      <h1>Report a Bug or Share Feedback</h1>

      <form id="support-form">
        <div class="form-row type-toggle">
          <label class="radio-pill">
            <input type="radio" name="report-type" value="bug" checked />
            <span>Bug Report</span>
          </label>
          <label class="radio-pill">
            <input type="radio" name="report-type" value="feedback" />
            <span>Feedback / Question / Comment</span>
          </label>
        </div>

        <div class="form-row">
          <label for="report-email">Email</label>
          <input type="email" id="report-email" readonly />
        </div>

        <div class="form-row">
          <label for="report-message">Message</label>
          <textarea id="report-message" rows="6" required placeholder="Tell us what happened, or what's on your mind..."></textarea>
        </div>

        <button type="submit" class="btn-solid" id="report-submit-btn">Submit</button>
        <p id="support-form-status" class="form-status" role="status"></p>
      </form>
    </div>
  </main>

  <script src="firebase-config.js"></script>
  <script src="session.js"></script>
  <script src="report.js"></script>
</body>
</html>
