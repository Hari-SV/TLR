<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Directory — The Lost Realm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin-users.css" />

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <a href="index.html" class="back-link">&larr; Back to Home</a>
      <a href="index.html" class="logo">The Lost Realm</a>
      <div id="session-bar" class="session-bar" hidden>
        <span id="session-label" class="session-label"></span>
      </div>
    </div>
    <button id="session-logout-btn" class="btn-ghost session-logout" hidden>Log Out</button>
  </header>

  <main class="admin-users-main">
    <div id="admin-denied" class="admin-denied" hidden>
      <p class="eyebrow">Restricted</p>
      <h1>Admins Only</h1>
      <p class="admin-denied-sub">You need to be signed in as an administrator to view this page.</p>
      <a href="admin-login.html" class="btn-solid">Admin Sign In</a>
    </div>

    <div id="admin-users-content" hidden>
      <section class="admin-users-header">
        <p class="eyebrow">Administration</p>
        <h1>User Directory</h1>
        <p class="admin-users-sub" id="user-count"></p>
      </section>

      <div class="search-row">
        <input
          type="search"
          id="user-search"
          class="user-search"
          placeholder="Search by username or email..."
          autocomplete="off"
        />
      </div>

      <div id="users-list" class="users-list"></div>
    </div>

    <div id="admin-users-status" class="admin-users-status">Checking permissions...</div>
  </main>

  <script src="firebase-config.js"></script>
  <script src="session.js"></script>
  <script src="admin-users.js"></script>
</body>
</html>
