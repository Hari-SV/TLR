<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard — The Lost Realm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="stats.css" />

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <a href="index.html" class="logo">The Lost Realm</a>
      <div id="session-bar" class="session-bar" hidden>
        <span id="session-label" class="session-label"></span>
      </div>
    </div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html#about">The Lost Realm</a></li>
        <li><a href="index.html#how-to-play">How to Play</a></li>
        <li><a href="index.html#account">Account</a></li>
      </ul>
    </nav>
    <button id="session-logout-btn" class="btn-ghost session-logout" hidden>Log Out</button>
  </header>

  <section class="stats-section">
    <div class="section-inner stats-inner">
      <p class="eyebrow">Hall of Champions</p>
      <h1>Leaderboard</h1>
      <p class="stats-subtitle">Fastest realm completions, ranked by time.</p>

      <div id="stats-status" class="stats-status">Loading leaderboard...</div>

      <table id="stats-table" class="stats-table" hidden>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Username</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="stats-tbody"></tbody>
      </table>
    </div>
  </section>

  <script src="firebase-config.js"></script>
  <script src="session.js"></script>
  <script src="stats.js"></script>
</body>
</html>
